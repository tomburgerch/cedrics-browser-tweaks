<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      background: #1a1a1a;
      color: #e8e8e8;
    }
    h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }
    .section {
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #333;
    }
    .section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #666;
      margin-bottom: 8px;
    }
    .speed-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .speed-btn {
      padding: 8px 0;
      border: 1px solid #444;
      border-radius: 6px;
      background: #2a2a2a;
      color: #ccc;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .speed-btn:hover {
      background: #383838;
      border-color: #666;
    }
    .speed-btn.active {
      background: #cc0000;
      border-color: #cc0000;
      color: #fff;
      font-weight: 700;
    }
    .status {
      font-size: 11px;
      color: #888;
      text-align: center;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }
    .toggle-label {
      font-size: 13px;
      color: #ccc;
    }
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #444;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-slider::before {
      content: "";
      position: absolute;
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .toggle-slider {
      background: #cc0000;
    }
    .toggle input:checked + .toggle-slider::before {
      transform: translateX(16px);
    }
    .blocked-sites {
      margin-top: 10px;
      font-size: 11px;
      color: #aaa;
    }
    .blocked-sites .hint {
      color: #666;
      margin-bottom: 6px;
    }
    .blocked-sites ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .blocked-sites li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #2a2a2a;
    }
    .blocked-sites li:last-child {
      border-bottom: none;
    }
    .blocked-sites .domain {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .blocked-sites .remove-btn {
      background: transparent;
      border: none;
      color: #666;
      font-size: 14px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      margin-left: 6px;
    }
    .blocked-sites .remove-btn:hover {
      color: #cc0000;
    }
    .add-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .add-row input {
      flex: 1;
      min-width: 0;
      padding: 6px 8px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #2a2a2a;
      color: #e8e8e8;
      font-size: 12px;
      font-family: inherit;
    }
    .add-row input:focus {
      outline: none;
      border-color: #cc0000;
    }
    .add-row button {
      padding: 6px 10px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #2a2a2a;
      color: #ccc;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .add-row button:hover {
      background: #383838;
      border-color: #666;
    }
    .add-error {
      font-size: 10px;
      color: #cc6666;
      margin-top: 4px;
      min-height: 12px;
    }
  </style>
</head>
<body>
  <div class="section">
    <div class="section-label">Focus Mode</div>
    <div class="toggle-row">
      <span class="toggle-label">Block distracting sites</span>
      <label class="toggle">
        <input type="checkbox" id="focus-mode">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="blocked-sites">
      <div class="hint">Blocked sites:</div>
      <ul id="focus-site-list"></ul>
      <div class="add-row">
        <input type="text" id="focus-add-input" placeholder="example.com" autocomplete="off">
        <button id="focus-add-btn">Add</button>
      </div>
      <div class="add-error" id="focus-add-error"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-label">YouTube</div>
    <h2>Playback Speed</h2>
    <div class="speed-grid">
      <button class="speed-btn" data-speed="1">1x</button>
      <button class="speed-btn" data-speed="1.25">1.25x</button>
      <button class="speed-btn" data-speed="1.5">1.5x</button>
      <button class="speed-btn" data-speed="1.75">1.75x</button>
      <button class="speed-btn" data-speed="2">2x</button>
      <button class="speed-btn" data-speed="2.5">2.5x</button>
    </div>
    <div class="status" id="yt-status">Loading...</div>
  </div>

  <div class="section">
    <div class="section-label">Windy.com</div>
    <div class="toggle-row">
      <span class="toggle-label">Auto-redirect to last location</span>
      <label class="toggle">
        <input type="checkbox" id="windy-redirect" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Auto-meteogram view</span>
      <label class="toggle">
        <input type="checkbox" id="windy-meteogram" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Auto 1h forecast</span>
      <label class="toggle">
        <input type="checkbox" id="windy-1h" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
